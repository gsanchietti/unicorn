<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stella e Bongo icons</title>
<!--
  Draws the app icon from the game's own art. Open with ?size=512 and save the
  canvas (or screenshot it with headless Chrome, as done for assets/icons/).
  ?size=N   icon size in pixels (default 512)
  ?pad=P    extra margin around the faces, 0..0.4 (default 0, maskable icons use 0.12)
  ?crop=head  only Stella's head, for the small browser-tab icon
-->
<style>
  html, body { margin: 0; background: transparent; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="icon"></canvas>
<script src="../js/art.js"></script>
<script src="../js/characters.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var N = parseInt(q.get('size'), 10) || 512;
  var pad = Math.min(0.4, Math.max(0, parseFloat(q.get('pad')) || 0));
  var cv = document.getElementById('icon');
  cv.width = cv.height = N;
  var g = cv.getContext('2d');

  var head = q.get('crop') === 'head';
  if (head) {
    // Small tab icon: a round lilac badge, stronger colors so it reads at 16-32 px.
    var bg = g.createLinearGradient(0, 0, N, N);
    bg.addColorStop(0, '#8fcdf5');
    bg.addColorStop(1, '#a98be8');
    g.fillStyle = bg;
    g.beginPath(); g.arc(N / 2, N / 2, N / 2, 0, Math.PI * 2); g.fill();
    g.save();
    g.beginPath(); g.arc(N / 2, N / 2, N / 2, 0, Math.PI * 2); g.clip();
  } else {
    // Pastel watercolor sky as the background.
    var sky = Art.paintSky(N, N * 1.6, 1);
    g.drawImage(sky.c || sky, 0, -N * 0.15, N, N * 1.6);
  }

  // Big glowing star behind the heads (the tab icon is too small for it).
  if (!head) {
    var star = Art.starSprite(N * 0.2, 1, {});
    var sc = star.c || star;
    var sx = N * (0.74 - pad * 0.3), sy = N * (0.24 + pad * 0.3);
    g.drawImage(sc, sx - sc.width / 2, sy - sc.height / 2);
  }

  // Close-up of both faces: crop of the rig around Stella's head and Bongo.
  var box = head
    ? { x: 600, y: 200, w: 360, h: 360 }               // Stella's head only (rig units)
    : { x: 330, y: 130, w: 600, h: 600 };              // both faces (rig units)
  var inner = N * (1 - 2 * pad);
  var k = inner / box.w;
  g.save();
  g.translate(N * pad, N * pad + N * 0.06 * (1 - 2 * pad));
  g.scale(k, k);
  g.translate(-box.x, -box.y);
  Characters.draw(g, { t: 0.35, run: 0, wave: 0, happy: 1, look: 0, glow: 1, face: 1 }, k);
  g.restore();
  if (head) g.restore();
  document.title = 'ready';
})();
</script>
</body>
</html>
